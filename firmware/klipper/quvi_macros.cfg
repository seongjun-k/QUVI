# QUVI 전용 매크로 — 출력 완료 후 로봇 픽업을 위한 베드 배출
# 좌표(Y 방향/X 대기위치/Z 높이)는 실기 테스트로 확정할 것

[gcode_macro PRINT_END]
description: 출력 완료 → 툴헤드 Z/Y 동시 이동 배출 및 대기
variable_park_x: 0        # 노즐 대기 X (로봇 경로 밖). 실기 조정
variable_park_z: 100      # 로봇 픽업용 최소 Z 높이(mm)
variable_z_lift: 10       # 출력물 위 추가 리프트(mm)
gcode:
    {% set th = printer.toolhead %}
    {% if "xyz" not in th.homed_axes %}
        RESPOND TYPE=error MSG="QUVI: 호밍(원점) 상태가 아닙니다. G28 후 실행하세요."
    {% else %}
        # 1) 툴헤드 Z 높이 계산: 최소 park_z, 출력물 높으면 그 위, 최대 z_max로 클램프
        {% set safe_z = [[th.position.z + z_lift, park_z]|max, th.axis_maximum.z]|min %}
        # 2) 히터/파트팬 정지
        TURN_OFF_HEATERS
        M107
        # 3) 대기 중 모터 타임아웃 방지 (1시간 동안 토크 유지)
        SET_IDLE_TIMEOUT TIMEOUT=3600
        # 4) Z축과 Y(베드)/X 동시 이동 배출
        G90
        G1 X{park_x} Y{th.axis_maximum.y} Z{safe_z} F6000
        M400
        # 5) 픽업 안정: XY/Z 모터 토크 유지(원점/좌표 유지 및 베드 고정), 익스트루더 모터만 해제
        # ※ M84 E 대신 SET_STEPPER_ENABLE을 사용해야 X,Y,Z 축 호밍 상태가 풀리지 않습니다.
        SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
        M117 PICKUP READY
        RESPOND TYPE=echo MSG="QUVI: bed ejected @Z{safe_z}, ready for robot pickup"
    {% endif %}

# 로봇 픽업 완료 후 다음 출력 준비(홈만, 가열은 슬라이서가)
[gcode_macro PICKUP_DONE]
description: 로봇 픽업 완료 후 홈 복귀
gcode:
    G28
    M117 READY
    RESPOND TYPE=echo MSG="QUVI: pickup done, homed"
