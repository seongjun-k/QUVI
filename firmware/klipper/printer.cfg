# QUVI KP3S printer.cfg 초안 — 기존 라즈베리파이 설정을 잃어 공식 샘플로 새로 구성했다.
# 원본: Klipper3d/klipper config/printer-kingroon-kp3s-2020.cfg (2026-11-08 master)
# 실기 미검증. 프린터가 샘플과 같은 KP3S(수정형 MKS Robin 보드)인지 확인한 뒤 사용한다.
#
# 펌웨어 빌드(make menuconfig): STM32F103, 28KiB bootloader, serial USART3 PB11/PB10,
# GPIO pins to set at micro-controller startup: !PC6,!PD13
# make flash 미지원: ./scripts/update_mks_robin.py out/klipper.bin out/Robin_nano.bin 후
# out/Robin_nano.bin을 SD 카드에 복사하고 프린터를 재시작한다.

[include mainsail.cfg]
[include quvi_macros.cfg]

[mcu]
# by-id 경로는 QUVI micro_ros_port(ESP32)와 같아 잘못된 장치를 열 수 있어 by-path로 지정한다.
# 허브(3-4)가 자주 끊겨 노트북 본체 포트에 직접 연결했다. USB 포트 위치 기준이므로 케이블을 옮기면 ls -l /dev/serial/by-path/ 로 다시 확인한다.
serial: /dev/serial/by-path/pci-0000:66:00.0-usb-0:1:1.0-port0
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 250
max_accel: 2000
max_z_velocity: 25
max_z_accel: 100

[stepper_x]
step_pin: PE3
# 샘플은 !PE2였으나 실기에서 X가 스위치 반대로 이동해 반전했다(2026-11-08).
dir_pin: PE2
enable_pin: !PE4
microsteps: 32
rotation_distance: 40
endstop_pin: !PA15
position_endstop: 0
position_max: 180
homing_speed: 50

[stepper_y]
step_pin: PE0
# 샘플은 !PB9였으나 실기에서 Y가 스위치 반대로 이동해 반전했다(2026-11-08).
dir_pin: PB9
enable_pin: !PE1
microsteps: 32
rotation_distance: 40
endstop_pin: !PA12
position_endstop: 0
# PRINT_END가 이 값까지 베드를 배출하므로 바꾸면 로봇 픽업 위치도 달라진다.
position_max: 180
homing_speed: 50

[stepper_z]
step_pin: PB5
# 샘플은 PB4였으나 실기에서 Z가 반대로(위로) 이동해 반전했다(2026-11-08).
dir_pin: !PB4
enable_pin: !PB8
microsteps: 32
rotation_distance: 8
endstop_pin: !PA11
# 샘플 값이다. 첫 출력 전에 Z_ENDSTOP_CALIBRATE로 다시 맞춘다.
position_endstop: 0.5
position_max: 180

[safe_z_home]
home_xy_position: 90,90
z_hop: 10

[thermistor Kingroon_B3950]
temperature1: 25.0
resistance1: 103180.0
temperature2: 150.0
resistance2: 1366.2
temperature3: 250.0
resistance3: 168.6

[extruder]
step_pin: PD6
dir_pin: !PD3
enable_pin: !PB3
microsteps: 32
gear_ratio: 3:1
rotation_distance: 23.244
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC3
sensor_type: Kingroon_B3950
sensor_pin: PC1
# 샘플 PID 값이다. 첫 출력 전에 PID_CALIBRATE로 다시 맞춘다.
control: pid
pid_kp: 27.057
pid_ki: 1.171
pid_kd: 156.254
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: PA0
sensor_type: Kingroon_B3950
sensor_pin: PC0
# 샘플 PID 값이다. 첫 출력 전에 PID_CALIBRATE로 다시 맞춘다.
control: pid
pid_kp: 61.779
pid_ki: 1.572
pid_kd: 606.980
min_temp: 0
max_temp: 130

[fan]
pin: PB1

[static_digital_output display_reset]
pins: !PC6, !PD13

# Mainsail 매크로 버튼용. 전 축 원점 복귀 후 Z를 띄운 채 X0 Y0 모서리에서 대기한다.
[gcode_macro GO_HOME]
description: 원점 복귀 후 X0 Y0 대기
gcode:
    G28
    G90
    G1 Z10 F600
    G1 X0 Y0 F6000
    M400

# Klipper가 시작(재시작·FIRMWARE_RESTART 포함)될 때마다 출력 완료 + 베드 배출 상태로 만든다.
# 사용자 결정(2026-11-08): 사람이 없어도 G28과 베드 배출 이동이 자동으로 일어난다.
[delayed_gcode QUVI_STARTUP_DONE]
initial_duration: 3
gcode:
    {% if printer.print_stats.state not in ["printing", "paused"] %}
        SDCARD_PRINT_FILE FILENAME=quvi_startup_done.gcode
    {% endif %}
